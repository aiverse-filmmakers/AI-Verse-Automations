[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-verse-automations"
version = "0.1.0"
description = "Canonical scheduler, trigger and wake-delivery runtime for AI-Verse"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AI-Verse Filmmakers"}]
dependencies = [
  "tzdata>=2025.2; platform_system == 'Windows'"
]

[project.scripts]
ai-verse-automations = "aiverse_automations.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
